<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Fest 2026</title>
  </head>
  <body>
    <!-- Header Section Starts Here -->
    <h1>Tech Fest 2026</h1>

    <!-- Nav Bar -->
    <section>
      <nav>
        <a href="index.html">Home</a> | <a href="events.html">Events</a> |
        <a href="registertation.html">Register</a>
      </nav>
    </section>
    <hr />
    <!-- Header Section Ends Here -->

    <!-- Registration Section Starts Here -->
    <section>
      <!-- Registeration Form -->
      <fieldset>
        <form action="POST" method="post">
          <label for="name">Name</label>
          <input type="text" id="name" required><br /><br />
          <label for="Email">Email</label>
          <input type="email" id="Email" required><br /><br />
          <label for="College">College Name</label>
          <input type="text" id="College" /><br /><br />
          <label for="Dob">D.o.B</label>
          <input type="date" id="Dob" /><br /><br />
          <label for="Phone">Mobile Number</label>
          <input type="tel" id="Phone" /><br /><br />
          <!-- Radio Button for Gender -->
          <legend>Gender</legend>
          <label for="gender-male">Male</label>
          <input type="radio" id="gender-male" name="gender" value="Male" />
          <label for="gender-female">Female</label>
          <input
            type="radio"
            id="gender-female"
            name="gender"
            value="Female"
          /><br /><br />

          <!-- Dropdown Option for selecting Year of College-->
          <label for="college-year">Current Year of Study</label>
          <select name="College_Year" id="year">
            <option value="" disabled selected>--Select a Year--</option>
            <option value="1">I Year</option>
            <option value="2">II Year</option>
            <option value="3">III Year</option>
            <option value="4">Final Year</option></select>
            <br /><br />
        
        <!-- File Upload -->
          <label for="photo">Upload a Photo of Yours</label>
          <input type="file" id="photo" /><br><br>

        <!-- Enter Your address Here -->
        <label for="address">Address</label><br>
        <textarea name="present-address" id="address" minlength="3" rows="5" cols="25" autocomplete="address" required></textarea>

          <br /><br />
          <button type="submit">SUBMIT</button>
        </form>
      </fieldset>
    </section>
    <!-- Registration Section Ends Here -->
